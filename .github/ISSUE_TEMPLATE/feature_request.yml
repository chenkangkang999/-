name: 功能建议
description: 提出新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: 方案设想
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options: [后端, 前端, RAG/算法, 多智能体, 监控/计费, 部署]