{
  "openapi": "3.0.3",
  "info": {
    "title": "医疗协作平台 API",
    "version": "0.3.0",
    "description": "Session + CSRF. All public medical replies pass the safety boundary. External algorithm providers remain replaceable."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "sessionCookie": []
    }
  ],
  "paths": {
    "/health/": {
      "get": {
        "security": [],
        "summary": "Database health",
        "responses": {
          "200": {
            "description": "Health state"
          }
        }
      }
    },
    "/accounts/csrf/": {
      "get": {
        "security": [],
        "summary": "Set CSRF cookie before login",
        "responses": {
          "200": {
            "description": "csrf_token; session cookie is HttpOnly"
          }
        }
      }
    },
    "/accounts/login/": {
      "post": {
        "security": [],
        "summary": "Session login; CSRF required",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "username",
                  "password"
                ],
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string",
                    "format": "password"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authenticated user, including is_staff"
          },
          "400": {
            "description": "Invalid credentials"
          },
          "403": {
            "description": "Missing or invalid CSRF"
          }
        }
      }
    },
    "/accounts/logout/": {
      "post": {
        "summary": "Logout; CSRF required",
        "responses": {
          "200": {
            "description": "Logged out"
          }
        }
      }
    },
    "/accounts/me/": {
      "get": {
        "summary": "Current authenticated user and profile",
        "responses": {
          "200": {
            "description": "User"
          },
          "403": {
            "description": "Authentication required"
          }
        }
      }
    },
    "/consultations/": {
      "get": {
        "summary": "Owned consultations, paginated",
        "responses": {
          "200": {
            "description": "count/next/previous/results"
          }
        }
      },
      "post": {
        "summary": "Create consultation; CSRF required",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "title": {
                    "type": "string",
                    "maxLength": 128
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Created consultation"
          }
        }
      }
    },
    "/consultations/{id}/": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer"
          }
        }
      ],
      "get": {
        "summary": "Owned consultation, including approved messages",
        "responses": {
          "200": {
            "description": "Consultation detail"
          },
          "404": {
            "description": "Missing or not owned"
          }
        }
      }
    },
    "/consultations/{id}/messages/": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer"
          }
        }
      ],
      "post": {
        "summary": "Synchronous compatibility entry; all replies safety gated",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "content"
                ],
                "properties": {
                  "content": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 20000
                  },
                  "intake": {
                    "$ref": "#/components/schemas/IntakeSubmission"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Completed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "409": {
            "description": "Active run"
          },
          "503": {
            "description": "Failed; reply is null",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          }
        }
      }
    },
    "/consultations/{id}/runs/": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer"
          }
        }
      ],
      "get": {
        "summary": "Recent 50 durable runs for restoration",
        "responses": {
          "200": {
            "description": "results: Run[]"
          }
        }
      },
      "post": {
        "summary": "Submit idempotent asynchronous run",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RunInput"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Idempotent existing run",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "202": {
            "description": "Created",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "409": {
            "description": "Conflicting request or active run"
          }
        }
      }
    },
    "/consultations/{id}/runs/{run_id}/": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer"
          }
        },
        {
          "name": "run_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "get": {
        "summary": "Durable run state; approved reply only",
        "responses": {
          "200": {
            "description": "Run",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "404": {
            "description": "Missing or not owned"
          }
        }
      }
    },
    "/consultations/{id}/feedback/": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "integer"
          }
        }
      ],
      "post": {
        "summary": "Upsert feedback on own completed run",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "run_id",
                  "rating"
                ],
                "properties": {
                  "run_id": {
                    "type": "string",
                    "format": "uuid"
                  },
                  "rating": {
                    "type": "integer",
                    "enum": [
                      1,
                      -1
                    ]
                  },
                  "comment": {
                    "type": "string",
                    "maxLength": 2000
                  },
                  "training_consent": {
                    "type": "boolean",
                    "default": false,
                    "description": "Explicit opt-in for deidentified retrieval training; false withdraws future export/prepare."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Feedback saved"
          }
        }
      }
    },
    "/agents/": {
      "get": {
        "summary": "Registered agents and integration readiness",
        "responses": {
          "200": {
            "description": "agents, debate_enabled, llm_configured, integration_status"
          }
        }
      }
    },
    "/agents/runs/": {
      "get": {
        "summary": "Own sanitized Agent telemetry",
        "parameters": [
          {
            "name": "trace_id",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "results"
          }
        }
      }
    },
    "/agents/{name}/test/": {
      "parameters": [
        {
          "name": "name",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string"
          }
        }
      ],
      "post": {
        "summary": "Staff-only single Agent test, with mandatory safety review",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "content"
                ],
                "properties": {
                  "content": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 20000
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Safe test output",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          },
          "403": {
            "description": "Staff permission required"
          },
          "503": {
            "description": "Failed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Run"
                }
              }
            }
          }
        }
      }
    },
    "/billing/usage/": {
      "get": {
        "summary": "Own usage; staff may request scope=all",
        "parameters": [
          {
            "name": "scope",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "own",
                "all"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "today/total/latest/by_day/by_query/by_run/by_user/measurement; costs are decimal strings"
          }
        }
      }
    },
    "/billing/budget/": {
      "get": {
        "summary": "Daily spent, reserved and remaining budget plus configuration readiness",
        "responses": {
          "200": {
            "description": "configured/price_configured/cost_limit/token_limit/currency/remaining_cost"
          }
        }
      }
    },
    "/monitoring/overview/": {
      "get": {
        "summary": "Owned metrics, or staff overview; unavailable data explicitly marked",
        "responses": {
          "200": {
            "description": "Agent/retrieval/knowledge/cost/feedback/failure metrics"
          }
        }
      }
    },
    "/learning/overview/": {
      "get": {
        "tags": [
          "Learning (staff)"
        ],
        "summary": "Current profile and real dataset/training counts",
        "description": "Staff Session required; all writes require CSRF. No GPU training is automatically launched.",
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or missing artifacts"
          },
          "403": {
            "description": "Session/staff/CSRF required"
          },
          "410": {
            "description": "Consent or frozen sample version revoked"
          }
        }
      }
    },
    "/learning/datasets/": {
      "get": {
        "tags": [
