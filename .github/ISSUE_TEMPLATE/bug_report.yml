name: Bug 报告
description: 提交可复现的缺陷
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么
    validations: {required: true}
  - type: textarea
    id: expect
    attributes:
      label: 期望行为
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations: {required: true}
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Windows 11 / Python 3.12 / Node 20