# 说明：依赖统一走 requirements/*.txt；本文件只放工具链配置。
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "frontend"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "agents", "rag", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = ["-q", "--strict-markers", "--tb=short"]
markers = [
  "unit: 纯单元测试",
  "integration: 跨模块/数据库集成测试",
  "e2e: 端到端测试",
  "slow: 慢测试",
]

[tool.coverage.run]
source = ["apps", "agents", "rag"]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true