# ============================================================
# BGE-M3 LoRA 微调 统一配置
# 所有路径 / 超参 / 镜像源都从这里读取，脚本本身不硬编码
# 改这里即可，无需改动任何 .py 脚本
# ============================================================

model:
  # 模型在镜像仓库上的 ID
  model_id: BAAI/bge-m3
  # 下载镜像：modelscope(阿里) / hf-mirror / huggingface
  mirror: modelscope
  # 基座模型本地目录（相对项目根目录）
  local_dir: models/pretrained/BAAI/bge-m3

data:
  # cMedQA2 三元组训练对（已对接进 data/processed/）
  train_file: data/processed/cmedqa2/train_triplets.jsonl
  val_file: data/processed/cmedqa2/val_triplets.jsonl
  # 样本上限（0 = 全量）。答辩实验建议先 20000 跑通，再按需调大
  max_train_samples: 20000
  max_val_samples: 1000
  # 默认保持原 anchor/positive + in-batch negatives；飞轮审核三元组训练可设为 true。
  # true 时所有训练/验证样本都必须有非空 negative，直接交给 MNRL 作为显式难负例。
  use_explicit_negatives: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # "all-linear" = 自动检测所有线性层；或显式列出层名（BGE-M3 / XLM-RoBERTa 的层名是 query/key/value/dense）
  target_modules: [query, key, value, dense]

train:
  # LoRA adapter 输出目录
  output_dir: models/finetuned/bge-m3-lora
  num_epochs: 1
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  max_seq_length: 512
  # LoRA 学习率高于全量微调（1e-4 ~ 5e-4）
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  # 学习率调度：linear 线性衰减（消融结论：1 epoch 下 linear 优于 cosine，Recall@1 更高）
  lr_scheduler_type: linear
  # 权重衰减：0（消融结论：wd=0.01 未带来收益，线性基线 wd=0 更优）
  weight_decay: 0.0
  bf16: false
  fp16: true
  # ---- 早停（early stopping）----
  # 已关闭：2ep 时早停在 0.96ep 过早触发、反而略逊于 1ep 基线；改为 1 epoch 直接训完
  early_stopping: false
  early_stopping_patience: 3
  early_stopping_threshold: 1.0e-4
  # 验证频率：每 100 步算一次 eval_loss，仅用于训练过程监控（答辩可展示收敛曲线）
  eval_strategy: steps
  eval_steps: 100
  save_steps: 1000
  # 不自动删除中间 checkpoint（save_total_limit 的删除会被沙箱安全策略拦截导致训练中断；训练结束后可手动清理 checkpoint-*）
  save_total_limit: null
  # 早停已关、1 epoch 直接训完，无需按 eval_loss 回退选最优 checkpoint
  load_best_model_at_end: false
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging_steps: 50
  seed: 42

eval:
  # 检索评测：每个 query 用 1 positive + N 个负例做候选池
  num_negatives: 19
  top_ks: [1, 5, 10]
  # 微调前后对比表输出
  output_csv: models/finetuned/eval_comparison.csv
  # 三组消融评测单独保留各版本，路径与展示标签均可替换。
  # 保留原评测脚本的目录约定；同学提供实际 adapter 后在此核对路径。
  comparison:
    output_csv: models/finetuned/eval_comparison_3way.csv
    models:
      base:
        label: 基座(微调前)
        adapter_dir: null
      baseline:
        label: 线性基线
        adapter_dir: models/finetuned/bge-m3-lora-baseline
      cosine:
        label: 余弦调优
        adapter_dir: models/finetuned/bge-m3-lora/final
